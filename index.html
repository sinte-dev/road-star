<!DOCTYPE html>
<html lang="am">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>የንግድ ምዝገባ — ሮድ ስታር ሞተር ሳይክል</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: #f0f4f1;
      font-family: 'Segoe UI', Arial, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 2rem 1rem;
      gap: 2rem;
    }

    .card {
      background: #fff;
      border-radius: 16px;
      overflow: hidden;
      width: 100%;
      max-width: 480px;
      box-shadow: 0 4px 24px rgba(0,0,0,0.10);
    }

    .header {
      background: #1a5c3a;
      padding: 22px 24px 18px;
      position: relative;
    }
    .flag-bar { display: flex; gap: 3px; margin-bottom: 10px; }
    .flag-bar span { height: 5px; flex: 1; border-radius: 2px; }
    .header .country {
      color: rgba(255,255,255,0.7);
      font-size: 11px;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      margin-bottom: 4px;
    }
    .header h1 { color: #fff; font-size: 22px; font-weight: 600; margin-bottom: 2px; }
    .header .subtitle { color: #a8d5be; font-size: 13px; }
    .stamp {
      position: absolute; right: 20px; top: 50%; transform: translateY(-50%);
      width: 58px; height: 58px; border-radius: 50%;
      border: 2.5px solid rgba(255,255,255,0.35);
      display: flex; align-items: center; justify-content: center;
      font-size: 10px; color: rgba(255,255,255,0.6);
      text-align: center; line-height: 1.3;
    }

    .body { padding: 22px 24px; display: flex; flex-direction: column; gap: 18px; }

    .row-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }

    .field { background: #f6faf7; border-radius: 10px; padding: 10px 13px; }
    .field label { font-size: 10.5px; color: #6b8c76; display: block; margin-bottom: 3px; line-height: 1.3; }
    .field .value { font-size: 13.5px; font-weight: 600; color: #1a3528; line-height: 1.4; }
    .field .value-sub { font-size: 11.5px; color: #5a7a65; margin-top: 1px; }
    .field.accent { background: #eaf5ef; }
    .field.accent .value { color: #1a5c3a; font-size: 15px; }

    .divider { height: 0.5px; background: #e2ece6; }

    .manager-row { display: flex; align-items: center; gap: 14px; }
    .avatar {
      width: 60px; height: 72px; border-radius: 8px;
      background: #d4e9dc; border: 1.5px solid #b2d4bf;
      display: flex; align-items: center; justify-content: center;
      flex-shrink: 0;
    }
    .avatar svg { opacity: 0.5; }
    .manager-info label { font-size: 10.5px; color: #6b8c76; display: block; margin-bottom: 4px; }
    .manager-info .name { font-size: 18px; font-weight: 700; color: #1a3528; }

    .card-footer {
      background: #f6faf7; border-top: 0.5px solid #e2ece6;
      padding: 14px 24px; display: flex; align-items: center; justify-content: space-between;
    }
    .verified { display: flex; align-items: center; gap: 6px; font-size: 12px; color: #1a5c3a; font-weight: 500; }
    .verified-dot { width: 8px; height: 8px; border-radius: 50%; background: #1a5c3a; }
    .reg-date { font-size: 11px; color: #8aaa96; }

    /* QR section */
    .qr-section h2 { font-size: 15px; color: #1a3528; font-weight: 600; }
    .qr-section p { font-size: 12px; color: #6b8c76; text-align: center; }

    @media print {
      body { padding: 0; gap: 1rem; }
      .qr-section, .card { box-shadow: none; }
    }
  </style>
</head>
